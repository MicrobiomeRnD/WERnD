
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wellness R&D Center</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            background:
                radial-gradient(circle at top left, rgba(76, 175, 80, 0.16), transparent 32%),
                radial-gradient(circle at bottom right, rgba(33, 150, 243, 0.18), transparent 28%),
                linear-gradient(135deg, #f7fbf8 0%, #eef5f8 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 1rem;
        }

        .title-wrap {
            position: relative;
            display: inline-block;
            padding-top: 2.8rem;
        }

        .bacteria-illustration {
            position: absolute;
            top: -110px;
            left: 50%;
            transform: translateX(-50%);
            width: 220px;
            height: 100px;
            z-index: 2;
            pointer-events: none;
            opacity: 0.95;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.05));
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        h1 {
            font-size: clamp(2rem, 5vw, 4rem);
            text-align: center;
            color: #2b2b2b;
            font-weight: 700;
            letter-spacing: -0.02em;
            padding: 1rem 1.5rem;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
            margin: 0;
            position: relative;
            z-index: 1;
        }

        .contents {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            padding: 0.5rem 0;
        }

        .contents a {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 18px;
            color: #4b5563;
            transition: color 0.2s ease;
        }

        .contents a:hover {
            color: #1f2937;
        }

        .slots {
            display: grid;
            grid-template-columns: repeat(4, minmax(150px, 1fr));
            gap: 1rem;
            width: 100%;
            max-width: 860px;
            margin-top: 1rem;
        }

        .slot {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(120, 130, 142, 0.24);
            border-radius: 18px;
            padding: 1rem 1.2rem;
            box-shadow: 0 4px 16px rgba(24, 39, 75, 0.05);
            min-height: 96px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 0.4rem;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .slot:hover {
            transform: translateY(-3px);
            border-color: rgba(120, 130, 142, 0.35);
            box-shadow: 0 8px 24px rgba(24, 39, 75, 0.08);
        }

        .slot-title {
            font-size: 16px;
            font-weight: 700;
            color: #273044;
            margin: 0;
        }

        .slot-label {
            font-size: 13px;
            color: #5a6370;
            margin: 0;
        }
    </style>
</head>
<body>

                <circle cx="80" cy="58" r="6" fill="#a3adb7" opacity="0.85"/>

        <div class="slots">
            <div class="slot">
                <p class="slot-title">Trends</p>

            <div class="slot">

                <p class="slot-label">연구 자료와 논문 링크</p>
            </div>
            <div class="slot">
