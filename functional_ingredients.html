            [59, "빌베리 추출물", "눈의 피로 개선", "빌베리 추출물 160~240 mg", "총 Anthocyanosides 300 mg/g 이상\nAnthocyanosides 50~108 mg"],
            [60, "마늘", "혈중 콜레스테롤 개선･혈압조절", "마늘 분말 0.6~1.0 g", "Alliin 10 mg/g 이상"],

        ];

        const table = document.getElementById("ingredientTable");
        const searchInput = document.getElementById("searchInput");
        const count = document.getElementById("count");

        function render() {
            const query = searchInput.value.trim().toLowerCase();
            table.replaceChildren();
            let visible = 0;
            items.forEach((item, index) => {
                const text = item.join(" ").toLowerCase();
                if (query && !text.includes(query)) return;
                const row = document.createElement("tr");
                item.forEach((value) => {
                    const cell = document.createElement("td");
                    cell.innerHTML = String(value || "-").replace(/\n/g, "<br>");
                    row.appendChild(cell);
                });
                table.appendChild(row);
                visible += 1;
            });
            if (!visible) table.innerHTML = '<tr><td class="empty" colspan="5">검색 결과가 없습니다.</td></tr>';
            count.textContent = `총 ${visible}개 항목`;
        }
        searchInput.addEventListener("input", render);
        render();
    </script>
