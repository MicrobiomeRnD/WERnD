<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microbiome R&D Center</title>
    <style>
        body {
            margin: 0;
            min-height: 100dvh;
            padding: 2rem 1rem;
            box-sizing: border-box;
            background: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1.5rem;
            width: min(100%, 1200px);
        }

        .panel {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            min-height: 560px;
        }

        .panel h2,
        .panel h1 {
            margin: 0;
            font-weight: 700;
            letter-spacing: -0.04em;
            color: #f8fafc;
        }

        .panel h1 {
            font-size: clamp(2rem, 3.5vw, 3.5rem);
        }

        .panel h2 {
            font-size: clamp(1.75rem, 3vw, 2.4rem);
        }

        .title-wrap {
            position: relative;
            display: inline-flex;
            width: fit-content;
            align-items: flex-start;
            gap: 1rem;
            padding-top: 1.5rem;
        }

        .bacteria-illustration {
            position: absolute;
            top: -100px;
            left: 0;
            width: 200px;
            height: 100px;
            z-index: 2;
            pointer-events: none;
            opacity: 0.95;
            filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.25));
        }

        .panel-logo {
            max-width: 220px;
            width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.35);
            align-self: flex-start;
            margin-bottom: -0.5rem;
        }

        .wellness-logo {
            width: 160px;
            height: auto;
            align-self: flex-end;
            margin-top: -1rem;
            opacity: 0.98;
        }

        .panel .title-wrap {
            padding-top: 3rem;
        }

        .panel a {
            text-decoration: none;
            color: inherit;
        }

        .contents {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            padding-top: 0.75rem;
            text-align: left;
        }

        .contents a {
            font-size: 1.05rem;
            color: #dce7fb;
            transition: color 0.2s ease, transform 0.2s ease;
            padding: 0.5rem 0.25rem;
        }

        .contents a:hover {
            color: #ffffff;
            transform: translateX(4px);
        }

        .slots {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1rem;
            width: 100%;
        }

        .slot {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 20px;
            padding: 1.4rem 1.2rem;
            box-shadow: 0 16px 30px rgba(0, 0, 0, 0.18);
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 0.45rem;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .slot:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.28);
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.22);
            background: rgba(255, 255, 255, 0.14);
        }

        .slot-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
            margin: 0;
        }

        .slot-label {
            font-size: 0.95rem;
            color: #dbeafe;
            margin: 0;
            line-height: 1.5;
        }

        .panel-card {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }

            .slots {
                grid-template-columns: 1fr;
            }

            .panel {
                min-height: auto;
            }

            .title-wrap {
                padding-top: 2.5rem;
            }

            .bacteria-illustration {
                position: relative;
                top: 0;
                left: 0;
                transform: none;
                width: 160px;
                margin-bottom: -1.5rem;
            }
        }
        </style>
    </head>
