<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microbiome R&D Center </title>
    <style>
        body {
            margin: 0;
            min-height: 100dvh;
            padding: 2rem 1rem;
            box-sizing: border-box;
            background: #1E2637;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1.5rem;
            width: min(100%, 1200px);
        }

        .panel {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            min-height: 560px;          
            position: relative;
            overflow: hidden;
        }
        
        .corner-character {
            position: absolute;
            right: 10px;
            bottom: 10px;

            width: 100px !important;
            max-width: 100px !important;
            height: auto !important;

            display: block;
            object-fit: contain;

            opacity: 0.95;
            pointer-events: none;
            z-index: 1;

            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.35));
        }

        .panel h2,
        .panel h1 {
            margin: 0;
            font-weight: 700;
            letter-spacing: -0.04em;
            color: #f8fafc;
        }

        .panel h1 {
            font-size: clamp(2.8rem, 3.1vw, 3.1rem);
        }

        .panel h2 {
            font-size: clamp(1.75rem, 3vw, 2.4rem);
        }

        .title-wrap {
            position: relative;
            display: inline-flex;
            width: fit-content;
            align-items: flex-start;
            gap: 1rem;
            padding-top: 1.5rem;

            margin: 0 auto;      /* 가운데 정렬 */
        }

        .bacteria-illustration {
            position: absolute;
            top: -100px;
            left: 0;
            width: 200px;
            height: 100px;
            z-index: 2;
            pointer-events: none;
            opacity: 0.95;
            filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.25));
        }

        .panel-logo {
            max-width: 110px;
            width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.35);
            align-self: flex-start;
            margin-top: 50px;      /* 추가 */
            margin-bottom: -0.5rem;

        }


        .panel .title-wrap {
            padding-top: 3rem;
        }

        .panel a {
            text-decoration: none;
            color: inherit;
        }

        .contents {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            padding-top: 0.75rem;
            text-align: left;
        }

        .contents a {
            font-size: 1.05rem;
            color: #dce7fb;
            transition: color 0.2s ease, transform 0.2s ease;
            padding: 0.5rem 0.25rem;
        }

        .contents a:hover {
            color: #ffffff;
            transform: translateX(4px);
        }

        .slots {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 1rem;
            width: 100%;
        }

        .slot {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 20px;
            padding: 1.4rem 1.2rem;
            box-shadow: 0 16px 30px rgba(0, 0, 0, 0.18);
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 0.45rem;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .slot:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.28);
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.22);
            background: rgba(255, 255, 255, 0.14);
        }

        .slot-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
            margin: 0;
        }

        .slot-label {
            font-size: 0.95rem;
            color: #dbeafe;
            margin: 0;
            line-height: 1.5;
        }

        .panel-card {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .youtube-container {
            width: 100%;
            margin-top: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .youtube-container iframe {
            width: 100%;
            max-width: 400px;
            height: 600px;
            border-radius: 16px;
            border: none;
            box-shadow: 0 12px 30px rgba(0,0,0,0.25);
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }

            .slots {
                grid-template-columns: 1fr;
            }

            .panel {
                min-height: auto;
            }

            .title-wrap {
                padding-top: 2.5rem;
            }

            .bacteria-illustration {
                position: relative;
                top: 0;
                left: 0;
                transform: none;
                width: 160px;
                margin-bottom: -1.5rem;
            }
        }
        </style>
    </head>
    <body>
        <div class="container">
            <section class="panel">
                <div class="title-wrap">
                    <img class="panel-logo" src="logo.png" alt="Microbiome R&D Center Logo">
                    <a href="https://blog.naver.com/dr_microbiome" target="_blank" rel="noopener noreferrer">
                        <h1>Microbiome<br>
                            R&D Center
                        </h1>
                    </a>
                </div>
                <div class="contents">
                    <a href="https://blog.naver.com/PostList.naver?blogId=dr_microbiome&from=postList&categoryNo=14" target="_blank" rel="noopener noreferrer">What is MAC?</a>
                    <a href="https://blog.naver.com/PostList.naver?blogId=dr_microbiome&from=postList&categoryNo=11" target="_blank" rel="noopener noreferrer">Feed Your Microbiome</a>
                    <a href="https://blog.naver.com/PostList.naver?blogId=dr_microbiome&from=postList&categoryNo=15" target="_blank" rel="noopener noreferrer">Probiotics</a>
                    <a href="https://blog.naver.com/PostList.naver?blogId=dr_microbiome&from=postList&categoryNo=16" target="_blank" rel="noopener noreferrer">Microbiome science</a>
                    <a href="https://blog.naver.com/PostList.naver?blogId=dr_microbiome&from=postList&categoryNo=10" target="_blank" rel="noopener noreferrer">Gut Health</a>
                </div>
            
            <img class="corner-character" src="우용이_배경제거.png" alt="Microbiome Researcher">
          
            </section>

            <section class="panel">
                <div class="panel-card">
                    <div class="slots">
                        <a class="slot" href="trends.html">
                            <p class="slot-title">Trends</p>
                            <p class="slot-label">연구 및 시장 동향</p>
                        </a>
                        <a class="slot" href="research.html">
                            <p class="slot-title">Research</p>
                            <p class="slot-label">연구 동향 확인</p>
                        </a>
                        <a class="slot" href="insights.html">
                            <p class="slot-title">Insights</p>
                            <p class="slot-label">Shorts 중심 최신 영상 모음</p>
                        </a>
                        <a class="slot" href="updates.html">
                            <p class="slot-title">Updates</p>
                            <p class="slot-label">신제품 정보와 최신 업데이트 확인</p>
                        </a>
                    </div>
                </div>

            
            <img class="corner-character" src="기현이_배경제거.png" alt="Bio informatics Researcher">

            </section>
        </div>
    </body>
    </html>
