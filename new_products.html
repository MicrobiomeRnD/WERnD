<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>건강기능식품 신규 등록 현황</title>
<style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");
    @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css");

    :root { color-scheme: light; --brand: #0b4f6c; --line: #e5e7eb; }
    * { box-sizing: border-box; }
    html { font-family: "Inter", "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    body { font-family: inherit; background: #f5f7fa; margin: 0; color: #333; }
    button, input, select, textarea, table { font: inherit; }
    .container { max-width: 1400px; margin: auto; padding: 30px; }
    h1, h2 { color: var(--brand); }
    h1 { margin-bottom: 8px; }
    .meta { color: #667085; margin: 0; }
    .summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; margin: 20px 0; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
    .card h2 { margin: 0; font-size: 18px; }
    .card .value { font-size: 32px; font-weight: bold; margin-top: 10px; }
    .section { margin-top: 40px; }
    .table-wrap { overflow-x: auto; border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.05); }
    .topbar {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    margin-bottom: 1.5rem;
    gap: 1rem;
}

.back-link {
    color: #2563eb;
    text-decoration: none;
    font-weight: 600;
}
    
    
    table { width: 100%; border-collapse: collapse; background: white; }
    th { background: var(--brand); color: white; padding: 12px; white-space: nowrap; }
    td { padding: 10px; border-bottom: 1px solid var(--line); text-align: center; }
    #functionTable .highlight-row > td {
        background-color: #fff7d6;
        font-weight: 700;
    }
    #productTable td:nth-child(2), #productTable td:nth-child(3), #productTable td:nth-child(4) { text-align: left; }
    .empty { padding: 28px; color: #667085; }
    .error { color: #b42318; }
    .percent {
    color: #667085;
    font-size: 0.85em;
    font-weight: normal;
}
    
    @media (max-width: 700px) {
        .container { padding: 20px 12px; }
        .summary { grid-template-columns: 1fr; gap: 12px; }
    }
</style>
</head>
<body>
    <div class="page">
        <div class="topbar">
            <a class="back-link" href="index.html">메인으로 돌아가기</a>
        </div>
</div>

<main class="container">
    <h1>건강기능식품 신규 등록 현황</h1>
    <p id="dataMeta" class="meta" aria-live="polite">데이터를 불러오는 중입니다.</p>

    <div id="summary" class="summary" aria-label="월별 등록 건수"></div>

    <section class="section">
        <h2>월별 기능성 분류</h2>
        <div class="table-wrap">
            <table>
                <thead>
                <tr id="functionHeader"></tr>
                </thead>
                <tbody id="functionTable"></tbody>
            </table>
        </div>
    </section>

    <section class="section">
        <h2>주요 신규 제품</h2>
        <div class="table-wrap">
            <table>
                <thead><tr><th>등록일</th><th>제품명</th><th>제조사</th><th>기능성</th></tr></thead>
                <tbody id="productTable"></tbody>
            </table>
        </div>
    </section>
</main>

<!-- file:// 로 직접 열 때 브라우저의 JSON fetch 제한에 대비한 보조 데이터입니다. -->
<script src="new_products_data/mfds_products_data.js"></script>
<script>
(() => {
    "use strict";
    const $ = id => document.getElementById(id);
    const categories = [
    "multi",
    "probiotic",
    "diet",
    "joint",
    "eye",
    "immunity",
    "cognitive",
    "triglyceride",
    "bloodflow",
    "cholesterol",
    "bloodpressure",
    "sleep",
    "etc"
];

    function text(value, fallback = "-") {
        const result = value == null ? "" : String(value).trim();
        return result || fallback;
    }

function categoryKeysOf(product) {

    const value = [
        product.ftnltClsfCdNm,
        product.PRIMARY_FNCLTY,
        product.FNCLTY_CN
    ]
    .filter(Boolean)
    .join(" ")
    .toLowerCase();

    let matched = [];

    if (/장 건강|장|유산균|프로바이오틱/.test(value))
        matched.push("probiotic");

    if (/체지방|다이어트|비만/.test(value))
        matched.push("diet");

    if (/관절|연골|뼈 건강/.test(value))
        matched.push("joint");

    if (/눈 건강|눈|시력|루테인/.test(value))
        matched.push("eye");

    if (/면역/.test(value))
        matched.push("immunity");

    if (/인지기능|기억력/.test(value))
        matched.push("cognitive");

    if (/혈중 중성지방|중성지방/.test(value))
        matched.push("triglyceride");

    if (/혈행/.test(value))
        matched.push("bloodflow");

    if (/콜레스테롤/.test(value))
        matched.push("cholesterol");

    if (/혈압/.test(value))
        matched.push("bloodpressure");

    if (/수면/.test(value))
        matched.push("sleep");

    if (matched.length >= 2)
        matched.unshift("multi");

    return matched.length ? matched : ["etc"];
}

    function monthOf(product) {
        const date = text(product.rptYmd || product.등록일자 || product.PRDLST_REPORT_DATE, "");
        const match = date.match(/^(\d{4})[-./]?(\d{2})/);
        return match ? `${match[1]}-${match[2]}` : "";
    }

    function render(data, source) {
        if (!data || !Array.isArray(data.products)) throw new Error("products 배열이 없습니다.");
        const products = data.products.slice().sort((a, b) => text(b.rptYmd, "").localeCompare(text(a.rptYmd, "")));
        const dataMonths = [...new Set(products.map(monthOf).filter(Boolean))].sort();
        // 기존 시안처럼 항상 최근 3개월을 보여주며, 데이터가 없는 달은 0건으로 표시합니다.
        const latest = dataMonths[dataMonths.length - 1];
        const months = latest ? Array.from({ length: 3 }, (_, index) => {
            const date = new Date(Number(latest.slice(0, 4)), Number(latest.slice(5)) - 3 + index, 1);
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}`;
        }) : [];
        const stats = Object.fromEntries(months.map(month => [month, Object.fromEntries(categories.map(key => [key, 0]))]));
        const counts = Object.fromEntries(months.map(month => [month, 0]));

        for (const product of products) {
            const month = monthOf(product);
            if (!month || !stats[month]) continue;
            counts[month]++;
            const keys = categoryKeysOf(product);
            for (const key of keys) {
                stats[month][key]++;
        }
        }

        const summaryMonths = months;
        $("summary").replaceChildren(...summaryMonths.map(month => {
            const card = document.createElement("div");
            card.className = "card";
            const heading = document.createElement("h2");
            heading.textContent = `${month.slice(0, 4)}년 ${Number(month.slice(5))}월`;
            const value = document.createElement("div");
            value.className = "value";
            value.textContent = `${counts[month].toLocaleString("ko-KR")}건`;
            card.append(heading, value);
            return card;
        }));

        if (!summaryMonths.length) $("summary").innerHTML = '<div class="card empty">표시할 등록일 데이터가 없습니다.</div>';
        const rowInfo = [
    ["total", "총 제품수"],
    ["multi", "다중기능성"],
    ["probiotic", "장 건강"],
    ["diet", "체지방"],
    ["joint", "관절"],
    ["eye", "눈"],
    ["immunity", "면역"],
    ["cognitive", "인지기능/기억력"],
    ["triglyceride", "혈중 중성지방"],
    ["bloodflow", "혈행"],
    ["cholesterol", "콜레스테롤"],
    ["bloodpressure", "혈압"],
    ["sleep", "수면"],
    ["etc", "기타"]
];

$("functionHeader").innerHTML =
    "<th>기능성</th>" +
    months.map(month => `<th>${month}</th>`).join("");

$("functionTable").innerHTML =
rowInfo.map(([key,label]) => `
<tr class="${
    key === "total" || key === "multi"
        ? "highlight-row"
        : ""
}">
<td>${label}</td>
${months.map(month => {

    if (key === "total") {
        return `<td>${counts[month]}</td>`;
    }

    const value = stats[month][key];
    const total = counts[month];

    const percent =
        total > 0
            ? ((value / total) * 100).toFixed(1)
            : "0.0";

    return `
        <td>
            ${value}
            <span class="percent">(${percent}%)</span>
        </td>
    `;

}).join("")}
</tr>
`).join("");


        const table = $("productTable");
        table.replaceChildren();
        if (!products.length) table.innerHTML = '<tr><td class="empty" colspan="4">표시할 제품이 없습니다.</td></tr>';
        for (const product of products.slice(0, 100)) {
            const row = document.createElement("tr");
            [product.rptYmd || product.등록일자, product.prdlstNm || product.제품명, product.bsshNm || product.업소명,
             product.ftnltClsfCdNm || product.PRIMARY_FNCLTY || product.FNCLTY_CN]
                .forEach(value => { const cell = document.createElement("td"); cell.textContent = text(value); row.append(cell); });
            table.append(row);
        }

        const generated = text(data.generated_at, "생성 시각 정보 없음");
        const range = months.length ? `${months[0]} ~ ${months[months.length - 1]}` : "등록일 없음";
        $("dataMeta").textContent = `등록일 기준: ${range} · 총 ${products.length.toLocaleString("ko-KR")}건 · 데이터 생성: ${generated}${source}`;
    }

    async function load() {
        try {
            const response = await fetch(`new_products_data/mfds_products.json?v=${Date.now()}`, { cache: "no-store" });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            render(await response.json(), "");
        } catch (error) {
            if (window.mfdsProductsData) {
                render(window.mfdsProductsData, " · 로컬 직접 열기용 JS 데이터 사용 중");
            } else {
                $("dataMeta").classList.add("error");
                $("dataMeta").textContent = `데이터를 불러오지 못했습니다: ${error.message}`;
                $("functionTable").innerHTML = '<tr><td class="empty" colspan="9">데이터를 불러오지 못했습니다.</td></tr>';
                $("productTable").innerHTML = '<tr><td class="empty" colspan="4">데이터를 불러오지 못했습니다.</td></tr>';
            }
        }
    }

    load();
})();
</script>
</body>
</html>
