<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Articles - Microbiome Trends</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
        }

        .page {
            max-width: 960px;
            margin: 0 auto;
            padding: 3rem 1.5rem 4rem;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            gap: 1rem;
        }

        .topbar h1 { margin: 0; font-size: 1.8rem; }

        .back-link {
            color: #bfdbfe;
            text-decoration: none;
            font-weight: 600;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 18px;
            padding: 1.4rem;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.2);
            margin-bottom: 1rem;
        }

        .article-title { margin: 0 0 0.75rem; font-size: 1.15rem; line-height: 1.45; }
        .article-meta { margin: 0.25rem 0; color: #cbd5e1; line-height: 1.6; }
        .article-description { margin: 0.9rem 0; color: #e2e8f0; line-height: 1.7; }

        .paper-link {
            display: inline-flex;
            padding: 0.45rem 0.7rem;
            border-radius: 999px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .paper-link:hover { background: #1d4ed8; }
        .message { color: #cbd5e1; line-height: 1.7; }
        .error { color: #fca5a5; }
    </style>
</head>
<body>
    <main class="page">
        <div class="topbar">
            <h1 id="area-title">대표 논문</h1>
            <a class="back-link" href="research.html">Research로 돌아가기</a>
        </div>
        <div id="article-list" aria-live="polite">
            <div class="card"><p class="message">논문을 불러오는 중입니다.</p></div>
        </div>
    </main>
    <script src="research_articles.js" defer></script>
</body>
</html>
